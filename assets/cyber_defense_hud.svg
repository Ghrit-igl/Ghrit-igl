<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="85%" stop-color="#00f5d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseTarget {
      0%, 100% { opacity: 0.2; r: 3px; }
      50% { opacity: 1; r: 6px; }
    }
    @keyframes blinkAlert {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(380px); }
    }
    .radar-sweep {
      transform-origin: 190px 190px;
      animation: rotateRadar 4s linear infinite;
    }
    .target-ping {
      animation: pulseTarget 1.8s ease-in-out infinite;
    }
    .target-ping-fast {
      animation: pulseTarget 1.1s ease-in-out infinite;
    }
    .alert-blink {
      animation: blinkAlert 1.2s infinite;
    }
    .scan-line {
      animation: scanline 6s linear infinite;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
  </style>

  <!-- Outer HUD Frame -->
  <rect x="2" y="2" width="916" height="376" rx="8" fill="url(#bgGrad)" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#00f5d4" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="920" y2="40"/>
    <line x1="0" y1="90" x2="920" y2="90"/>
    <line x1="0" y1="140" x2="920" y2="140"/>
    <line x1="0" y1="190" x2="920" y2="190"/>
    <line x1="0" y1="240" x2="920" y2="240"/>
    <line x1="0" y1="290" x2="920" y2="290"/>
    <line x1="0" y1="340" x2="920" y2="340"/>
    
    <line x1="70" y1="0" x2="70" y2="380"/>
    <line x1="190" y1="0" x2="190" y2="380"/>
    <line x1="310" y1="0" x2="310" y2="380"/>
    <line x1="430" y1="0" x2="430" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="670" y1="0" x2="670" y2="380"/>
    <line x1="790" y1="0" x2="790" y2="380"/>
  </g>

  <!-- HUD Top Header -->
  <rect x="2" y="2" width="916" height="36" fill="#0c111c" rx="8" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="20" cy="20" r="5" fill="#ff0055" filter="url(#redGlow)" class="alert-blink"/>
  <circle cx="36" cy="20" r="5" fill="#f7df1e" opacity="0.8"/>
  <circle cx="52" cy="20" r="5" fill="#00f5d4" opacity="0.8"/>
  
  <text x="75" y="24" fill="#00f5d4" font-size="12" font-weight="700" letter-spacing="2" class="mono">GLOBAL CYBER DEFENSE // FBI &amp; INTERPOL SURVEILLANCE RADAR</text>
  <rect x="730" y="10" width="170" height="20" rx="3" fill="#ff0055" fill-opacity="0.15" stroke="#ff0055" stroke-width="1"/>
  <text x="815" y="24" fill="#ff0055" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5" class="mono alert-blink">THREAT LEVEL: CRITICAL</text>

  <!-- ==================== LEFT RADAR SECTION ==================== -->
  <g transform="translate(0, 0)">
    <!-- Radar Concentric Circles -->
    <circle cx="190" cy="200" r="140" fill="none" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="190" cy="200" r="105" fill="none" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="190" cy="200" r="70" fill="none" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="190" cy="200" r="35" fill="none" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.55"/>
    <circle cx="190" cy="200" r="4" fill="#00f5d4" filter="url(#cyanGlow)"/>

    <!-- Radar Crosshairs -->
    <line x1="190" y1="55" x2="190" y2="345" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>
    <line x1="45" y1="200" x2="335" y2="200" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>

    <!-- Rotating Radar Sweep Wedge -->
    <g class="radar-sweep" style="transform-origin: 190px 200px;">
      <path d="M 190 200 L 330 200 A 140 140 0 0 0 289 101 Z" fill="url(#sweepGrad)"/>
      <line x1="190" y1="200" x2="330" y2="200" stroke="#00f5d4" stroke-width="2" filter="url(#cyanGlow)"/>
    </g>

    <!-- Radar Threat Blips -->
    <circle cx="250" cy="140" r="4" fill="#ff0055" filter="url(#redGlow)" class="target-ping"/>
    <text x="258" y="138" fill="#ff0055" font-size="8" class="mono">SLOPSQUAT #92</text>

    <circle cx="130" cy="260" r="4" fill="#ff0055" filter="url(#redGlow)" class="target-ping-fast"/>
    <text x="80" y="275" fill="#ff0055" font-size="8" class="mono">TAINT_VECTOR</text>

    <circle cx="230" cy="270" r="4" fill="#00f5d4" filter="url(#cyanGlow)" class="target-ping"/>
    <text x="238" y="278" fill="#00f5d4" font-size="8" class="mono">NOTEER_NODE</text>

    <circle cx="120" cy="130" r="4" fill="#f7df1e" class="target-ping"/>
    <text x="75" y="125" fill="#f7df1e" font-size="8" class="mono">QEMU_VM</text>

    <text x="190" y="358" fill="#00f5d4" font-size="9" text-anchor="middle" letter-spacing="1" class="mono" opacity="0.7">ACTIVE RANGE: 360° // SCAN FREQ: 1000 HZ</text>
  </g>

  <!-- Vertical Divider with Cyber Notches -->
  <line x1="380" y1="45" x2="380" y2="365" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="377" y="90" width="6" height="20" fill="#00f5d4" opacity="0.6"/>
  <rect x="377" y="220" width="6" height="20" fill="#ff0055" opacity="0.6"/>

  <!-- ==================== RIGHT TERMINAL INTEL ==================== -->
  <g transform="translate(400, 45)">
    <!-- Terminal Header Bar -->
    <text x="0" y="20" fill="#94a3b8" font-size="11" class="mono">TARGET AGENT: <tspan fill="#ffffff" font-weight="700">Ayush Kaushik (Ghrit-igl)</tspan></text>
    <text x="320" y="20" fill="#94a3b8" font-size="11" class="mono">PROTOCOL: <tspan fill="#00f5d4" font-weight="700">CYBER-SENTINEL v2.6</tspan></text>

    <!-- Threat Log Panel -->
    <rect x="0" y="35" width="500" height="240" rx="4" fill="#080c14" stroke="#00f5d4" stroke-opacity="0.25" stroke-width="1"/>
    
    <!-- Log Items -->
    <g transform="translate(15, 60)" class="mono" font-size="10">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#00f5d4">[SEC_SCAN]</text>
      <text x="80" y="0" fill="#ffffff">Tree-sitter CST AST scan latency: </text>
      <text x="320" y="0" fill="#00f5d4" font-weight="700">0.771 ms (P50)</text>

      <!-- Line 2 -->
      <text x="0" y="26" fill="#ff0055">[INTERCEPT]</text>
      <text x="80" y="26" fill="#e2e8f0">AI Slopsquatting exploit blocked:</text>
      <text x="320" y="26" fill="#ff0055" font-weight="700">100% NEUTRALIZED</text>

      <!-- Line 3 -->
      <text x="0" y="52" fill="#00f5d4">[COMPILER]</text>
      <text x="80" y="52" fill="#e2e8f0">AAYU Language (Rust + Cranelift):</text>
      <text x="320" y="52" fill="#00f5d4" font-weight="700">BARE-METAL EMIT</text>

      <!-- Line 4 -->
      <text x="0" y="78" fill="#f7df1e">[MICRO_OS]</text>
      <text x="80" y="78" fill="#e2e8f0">yellow-flash-os in volatile RAM:</text>
      <text x="320" y="78" fill="#f7df1e" font-weight="700">ZERO DISK TRACE</text>

      <!-- Line 5 -->
      <text x="0" y="104" fill="#00f5d4">[BLOCKCHAIN]</text>
      <text x="80" y="104" fill="#e2e8f0">neuro-ledger Smart Contracts:</text>
      <text x="320" y="104" fill="#00f5d4" font-weight="700">INVARIANTS PROVEN</text>

      <!-- Line 6 -->
      <text x="0" y="130" fill="#7928ca">[HFT_ENGINE]</text>
      <text x="80" y="130" fill="#e2e8f0">apex-hft in-memory order book:</text>
      <text x="320" y="130" fill="#7928ca" font-weight="700">NANOSECOND CAS</text>

      <!-- Line 7 -->
      <text x="0" y="156" fill="#00f5d4">[QUANTUM]</text>
      <text x="80" y="156" fill="#e2e8f0">BB84 QKD &amp; Grover Simulator:</text>
      <text x="320" y="156" fill="#00f5d4" font-weight="700">BELL STATES VERIFIED</text>

      <!-- Line 8 -->
      <text x="0" y="185" fill="#38ef7d" font-weight="700">&gt;&gt; POLICE POSTURE: GLOBAL DEFENSE MATRIX ACTIVE. ACCESS RESTRICTED.</text>
    </g>

    <!-- Bottom Stat Pill Boxes -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="115" height="32" rx="3" fill="#0f172a" stroke="#00f5d4" stroke-opacity="0.3"/>
      <text x="10" y="14" fill="#64748b" font-size="8" class="mono">AI GUARD</text>
      <text x="10" y="26" fill="#00f5d4" font-size="10" font-weight="700" class="mono">NOTEER 2026</text>

      <rect x="125" y="0" width="115" height="32" rx="3" fill="#0f172a" stroke="#ff0055" stroke-opacity="0.3"/>
      <text x="135" y="14" fill="#64748b" font-size="8" class="mono">INSECURE RATE</text>
      <text x="135" y="26" fill="#ff0055" font-size="10" font-weight="700" class="mono">0.00% PASS</text>

      <rect x="250" y="0" width="115" height="32" rx="3" fill="#0f172a" stroke="#f7df1e" stroke-opacity="0.3"/>
      <text x="260" y="14" fill="#64748b" font-size="8" class="mono">SIEM AUDIT</text>
      <text x="260" y="26" fill="#f7df1e" font-size="10" font-weight="700" class="mono">MERKLE TREE</text>

      <rect x="375" y="0" width="125" height="32" rx="3" fill="#0f172a" stroke="#00f5d4" stroke-opacity="0.3"/>
      <text x="385" y="14" fill="#64748b" font-size="8" class="mono">THREAT STATUS</text>
      <text x="385" y="26" fill="#00f5d4" font-size="10" font-weight="700" class="mono">DEFLECTED [OK]</text>
    </g>
  </g>
</svg>